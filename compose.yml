services:
  refapp-mcp:
    build: .
    environment:
      MCP_HOST: 0.0.0.0
      MCP_PORT: 9000
      SWAGGER_URL: http://host.docker.internal:3500/api/v2/swagger/json
    ports:
      - "9000:9000"

  open-web-ui:
    image: ghcr.io/open-webui/open-webui:main
    depends_on:
      - refapp-mcp
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8180:8080"
    environment:
      WEBUI_URL: http://localhost:8180
      ENABLE_OPENAI_API: "true"
      OPENAI_API_BASE_URL: ${LLM_API_BASE_URL:-https://api.openai.com/v1}
      OPENAI_API_KEY: ${LLM_API_KEY:-}
      DEFAULT_MODELS: ${LLM_MODEL:-}

      OAUTH_PROVIDER_NAME: Keycloak
      OPENID_PROVIDER_URL: http://host.docker.internal:8082/realms/referentiel-applications/.well-known/openid-configuration
      OPENID_REDIRECT_URI: http://localhost:8180/oauth/oidc/callback
      OAUTH_CLIENT_ID: referentiel-applications
      OAUTH_CLIENT_SECRET: change-me
      OAUTH_SCOPES: openid profile email
      OAUTH_MERGE_ACCOUNTS_BY_EMAIL: "true"
      ENABLE_OAUTH_SIGNUP: "true"
      DEFAULT_USER_ROLE: "user"

      ENABLE_LOGIN_FORM: "false"
      ENABLE_SIGNUP: "false"

      TOOL_SERVER_CONNECTIONS: >-
        [{"type":"mcp","url":"http://refapp-mcp:9000/mcp","path":"/mcp","auth_type":"system_oauth","key":"","headers":{},"config":{"enable":true,"access_grants":[{"principal_type":"user","principal_id":"*","permission":"read"}]},"info":{"id":"refapp-mcp","name":"Refapp MCP","description":"refapp mcp server"}}]

      ENABLE_ONBOARDING: "false"
      TOKENIZERS_PARALLELISM: "false"
    volumes:
      - open-web-ui-data:/app/backend/data

volumes:
  open-web-ui-data:
